{% extends 'base.html' %}


{% block content %}


<br>
<h2>Add Employee</h2>
<form action="{{ url_for('add_name') }}" method="POST">
    <input type="text" name="name" placeholder="Enter employee name" required>
    <button type="submit" class="addButton">Add Name</button>
</form>


<br><br>


<h2>Employee List</h2>
<table>
    <tr>
        <th>No.</th>
        <th>Employee Name</th>
        <th>Actions</th>
    </tr>
    {% for name in names %}
    <tr>
        <td>{{ loop.index }}</td>
        <td>{{ name }}</td>


        <td>
            <!-- Edit Button -->
            <button type="button" class="editButton" onclick="litawEdit('{{ loop.index0 }}')">Edit</button>
           
            <!-- Delete Button -->
            <form action="{{ url_for('delete_name', index=loop.index0) }}" method="POST" class="actions" onsubmit="return confirm('Are you sure you want to delete this employee?');">
                <button type="submit" class="deleteButton">Delete</button>
            </form>


            <!-- Edit Form-->
            <form action="{{ url_for('edit_name', index=loop.index0) }}" method="POST" id="edit-{{ loop.index0 }}" class="editForm">
                <input type="text" name="name" value="{{ name }}" required>
                <button type="submit" class="updateButton">Update</button>
            </form>
        </td>
    </tr>


    {% else %}
    <tr>
        <td colspan="3">No employee names available.</td>
    </tr>
    {% endfor %}
</table>


<script>
    function litawEdit(index) {
        let form = document.getElementById('edit-' + index);


        if (form.style.display === 'none') {
            form.style.display = 'block';
        }
       
        else {
            form.style.display = 'none';
        }
    }
</script>


{% endblock %}
