DOCTYPE html>
<html>
<head>
    <title>E<!MPLOYEE REGISTRATION</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }


        .container {
            max-width: 700px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 8px;
        }


        h1 {
            text-align: center;
        }
       
        input {
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px;
        }


        button {
            border: none;
            border-radius: 4px;
            color: white;
            padding: 10px;
        }


        .addButton {
            background: #198754;
        }


        .editButton {
            background: #0d6efd;
        }


        .editForm {
            display: none;
            margin-top: 10px;
        }


        .updateButton {
            background: #ffc107;
        }
        .deleteButton {
            background: #dc3545;
        }


        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }


        td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }


        th {
            background: #405b7d;
            color: white;
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }


        .actions {
            display: inline-block;
            margin: 3px;
        }
    </style>
</head>


<body>
    <div class="container">
        <h1>REGISTER EMPLOYEE</h1>
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
